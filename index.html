<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trip Budget Estimator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">

        <h1 class="mb-4 text-center">Trip Budget Estimator</h1>

        <form id="budget-form" class="card p-4 shadow-sm mb-4">
          <div class="mb-3">
            <label for="city" class="form-label">City</label>
            <input type="text" id="city" class="form-control" placeholder="e.g. Madrid" required />
          </div>
          <div class="mb-3">
            <label for="days" class="form-label">Days</label>
            <input type="number" id="days" class="form-control" value="3" min="1" max="7" required />
          </div>
          <button type="submit" class="btn btn-primary w-100">Calculate</button>
        </form>

        <p id="result" class="fw-bold text-center mb-3">...</p>

        <div id="booking" class="text-center" style="display: none;">
          <a href="https://www.booking.com/index.html?aid=YOUR_REF_ID" target="_blank" class="btn btn-outline-success">
            Book your stay with Booking.com
          </a>
        </div>

      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("budget-form");
    const result = document.getElementById("result");
    const booking = document.getElementById("booking");
    const API_KEY = "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";
   form.addEventListener("submit", async function (e) {
  e.preventDefault();

  const city = document.getElementById("city").value.trim().toLowerCase();
  const days = parseInt(document.getElementById("days").value, 10);

  if (!city || isNaN(days) || days < 1 || days > 7) {
    result.textContent = "Please enter a valid city and 1–7 days.";
    booking.style.display = "none";
    return;
  }

  result.textContent = "Calculating...";

  const prompt = `You are a strict travel cost calculator. Your task is to reply with a single integer (no euro sign, no words, no explanation) that represents the total estimated travel budget in euros for a tourist staying ${days} days in ${city}. If you cannot calculate it, reply ONLY with: error.`;

  try {
    const response = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${API_KEY}`
      },
      body: JSON.stringify({
        model: "gpt-3.5-turbo",
        messages: [{ role: "user", content: prompt }],
        temperature: 0.7
      })
    });

    const data = await response.json();
    const rawAnswer = data.choices?.[0]?.message?.content?.trim().toLowerCase();

    if (rawAnswer === "error") {
      result.textContent = "City not found or invalid input.";
      booking.style.display = "none";
    } else {
      const answer = rawAnswer.match(/\d+/)?.[0];
      if (answer) {
        result.textContent = `Estimated budget: €${answer}`;
        booking.style.display = "block";
      } else {
        result.textContent = "Could not estimate budget.";
        booking.style.display = "none";
      }
    }
  } catch (err) {
    result.textContent = "API error.";
    booking.style.display = "none";
  }
});
  </script>
</body>
</html>
