<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trip Budget Estimator</title>
</head>
<body>
  <h1>Trip Budget Estimator</h1>

  <form id="budget-form">
    <label>
      City:
      <input type="text" id="city" placeholder="Madrid" required />
    </label>
    <br />
    <label>
      Days:
      <input type="number" id="days" value="3" min="1" required />
    </label>
    <br /><br />
    <button type="submit">Calculate</button>
  </form>

  <p id="result" style="margin-top: 20px;">...</p>

  <div id="booking" style="margin-top: 30px; display: none;">
    <a href="https://www.booking.com/index.html?aid=YOUR_REF_ID" target="_blank">
      <img src="https://cf.bstatic.com/static/img/affiliate_base/banner/728x90/728x90.jpg"
           alt="Book your stay with Booking.com" width="728" height="90" style="border:0;" />
    </a>
  </div>

  <script>
    const form = document.getElementById("budget-form");
    const result = document.getElementById("result");
    const booking = document.getElementById("booking");

async function validateCity(city) {
  const slug = city.toLowerCase().trim().replace(/\s+/g, '-');
  try {
    const res = await fetch("https://api.teleport.org/api/urban_areas/");
    const data = await res.json();
    const exists = data._links["ua:item"].some(item => item.href.includes(`/slug:${slug}/`));
    return exists;
  } catch (err) {
    console.error("City validation error:", err);
    return false;
  }
}

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      const cityInput = document.getElementById("city").value.trim();
      const city = cityInput.toLowerCase();
      const days = parseInt(document.getElementById("days").value, 10);

      if (!city || isNaN(days) || days < 1) {
        result.textContent = "Please enter a valid city and number of days.";
        return;
      }

      result.textContent = "Validating city...";
      booking.style.display = "none";

      const isValid = await validateCity(city);

      if (!isValid) {
        result.textContent = "City not found.";
        return;
      }

      result.textContent = "Calculating...";

      fetch("https://hook.eu2.make.com/qqat0dkk3irc0ir3okc5axn02904zcif", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ city, days })
      })
      .then(async r => {
        const text = await r.text();
        console.log("RAW:", text);
        try {
          const data = JSON.parse(text);
          if (data.budget === "error") {
            result.textContent = "City not found or invalid input.";
          } else {
            result.textContent = "Estimated budget: €" + data.budget;
            booking.style.display = "block";
          }
        } catch {
          result.textContent = "Error parsing response: " + text;
        }
      })
      .catch(() => {
        result.textContent = "Network error.";
      });
    });
  </script>
</body>
</html>
