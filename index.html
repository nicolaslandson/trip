<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plan your trip in seconds</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">

        <h1 class="mb-4 text-center">Trip Budget Estimator</h1>

        <form id="budget-form" class="card p-4 shadow-sm mb-4">
          <div class="mb-3">
            <label for="city" class="form-label">City</label>
            <input type="text" id="city" class="form-control" placeholder="e.g. Madrid" required />
          </div>
          <div class="mb-3">
            <label for="days" class="form-label">Days</label>
            <input type="number" id="days" class="form-control" value="3" min="1" max="7" required />
          </div>
          <button type="submit" class="btn btn-primary w-100">Calculate</button>
          <small class="text-muted text-center d-block mb-3">
            *Quick estimate with travel tips & tools
          </small>
        </form>

        <p id="result" class="fw-bold text-center mb-3">...</p>

        <div id="guide" class="text-center mb-3" style="display: none;">
          <a href="https://payhip.com/b/jBeha" class="btn btn-warning" target="_blank" rel="noopener noreferrer">
            📘 Buy a city Sevilla guide
          </a>
        </div>

        <div id="booking" class="text-center" style="display: none;">
          <a href="https://hotellook.tp.st/xLYmbFT9" class="btn btn-outline-success" target="_blank" rel="noopener noreferrer">
            Find a hotel in <span id="city-label">your city</span> (with discount)
          </a>
        </div>

        <div id="centauro" class="text-center mt-3" style="display: none;">
          Rent a car in <span id="city-centauro">your city</span> with discount
          <a href="https://www.tkqlhce.com/click-101440156-15165285" class="btn btn-outline-primary" target="_blank" rel="noopener noreferrer">
            Centauro ES
          </a>
          <img src="https://www.lduhtrp.net/image-101440156-15165285" width="1" height="1" border="0"/>
        </div>

        <div id="aviasales" class="text-center mt-3" style="display: none;">
          <a href="https://aviasales.tp.st/s2IQNhZd" class="btn btn-outline-primary">
            Find cheap flights to <span id="city-aviasales">your city</span> with Aviasales
          </a>
        </div>

        <div class="text-center mt-3">
          <a
            href="https://wa.me/?text=Check%20this%20trip%20budget%20tool:%20https://tripok.es"
            target="_blank"
            class="btn btn-success"
          >
            📲 Share on WhatsApp
          </a>
        </div>

      </div>
    </div>
  </div>

<script>
  const form = document.getElementById("budget-form");
  const result = document.getElementById("result");
  const booking = document.getElementById("booking");
  const guide = document.getElementById("guide");
  const centauro = document.getElementById("centauro");
  const aviasales = document.getElementById("aviasales");
  const cityLabel = document.getElementById("city-label");
  const cityCentauro = document.getElementById("city-centauro");
  const cityAviasales = document.getElementById("city-aviasales");

  const API_KEY = "eOPNMl/29V2C38j2QBLPAg==7r1sgRQNZlt7LDpl";

  form.addEventListener("submit", async function (e) {
    e.preventDefault();

    const city = document.getElementById("city").value.trim();
    const days = parseInt(document.getElementById("days").value, 10);

    if (!city || isNaN(days) || days < 1 || days > 7) {
      result.textContent = "Please enter a valid city and 1–7 days.";
      [booking, guide, centauro, aviasales].forEach(el => el.style.display = "none");
      return;
    }

    result.textContent = "Checking city...";

    try {
      const response = await fetch(`https://api.api-ninjas.com/v1/city?name=${encodeURIComponent(city)}`, {
        headers: { "X-Api-Key": API_KEY }
      });

      const data = await response.json();

      if (!Array.isArray(data) || data.length === 0) {
        result.textContent = "City not found.";
        [booking, guide, centauro, aviasales].forEach(el => el.style.display = "none");
        return;
      }

      const budget = days * 100;
      result.textContent = `Example trip budget: ~€${budget}`;
      cityLabel.textContent = city;
      cityCentauro.textContent = city;
      cityAviasales.textContent = city;

      booking.style.display = "block";
      centauro.style.display = "block";
      aviasales.style.display = "block";

      if (city.toLowerCase() === "sevilla" || city.toLowerCase() === "seville") {
        guide.style.display = "block";
      } else {
        guide.style.display = "none";
      }

    } catch (err) {
      console.error(err);
      result.textContent = "City check failed.";
      [booking, guide, centauro, aviasales].forEach(el => el.style.display = "none");
    }
  });
</script>

</body>
</html>
