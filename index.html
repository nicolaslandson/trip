<script>
  const form = document.getElementById("budget-form");
  const result = document.getElementById("result");
  const booking = document.getElementById("booking");

  async function validateCity(city) {
    const slug = city.trim().toLowerCase().replace(/\s+/g, '-');
    const res = await fetch(`https://api.teleport.org/api/urban_areas/slug:${slug}/`);
    return res.ok;
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();

    const city = document.getElementById("city").value.trim();
    const days = parseInt(document.getElementById("days").value, 10);

    result.textContent = "Validating city...";
    booking.style.display = "none";

    const isValid = await validateCity(city);

    if (!isValid) {
      result.textContent = "City not found.";
      return;
    }

    result.textContent = "Calculating...";

    fetch("https://hook.eu2.make.com/qqat0dkk3irc0ir3okc5axn02904zcif", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ city, days })
    })
      .then(r => r.json())
      .then(data => {
        result.textContent = "Estimated budget: €" + data.budget;
        booking.style.display = "block";
      })
      .catch(() => {
        result.textContent = "Error calculating budget.";
      });
  });
</script>
